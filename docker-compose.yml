services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verdant
      POSTGRES_PASSWORD: verdant
      POSTGRES_DB: verdant
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdant"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://verdant:verdant@db:5432/verdant
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-0123456789abcdefghijklmnop}
      CORS_ORIGINS: http://localhost:8080
      STORAGE_DIR: /app/storage
    volumes: [uploads:/app/storage]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  pgdata:
  uploads:
